name: Release Dev (Android internal)

# Build the dev variant (com.getgymli.dev) and submit to the Play internal
# testing track. Run manually with:  eas workflow:run release-dev.yml
# (or connect the EAS GitHub app to enable the push trigger below).
on:
  push:
    branches: ['develop']

jobs:
  build_android_dev:
    name: Build dev AAB
    type: build
    params:
      platform: android
      profile: preview

  submit_android_dev:
    name: Submit dev to Play internal
    needs: [build_android_dev]
    type: submit
    params:
      platform: android
      profile: preview
